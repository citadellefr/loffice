name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: sudo apt-get install -y fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2
      - run: corpus/fetch.sh
      - run: go test -race -short ./...
      - run: go test ./...
        env:
          LOFFICE_FONTS: /usr/share/fonts/truetype

  # Every package the corpus tests rewrite must add no error to what the
  # Open XML SDK finds in the original.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: corpus/fetch.sh
      - run: LOFFICE_OUT=$RUNNER_TEMP/out go test ./opc -run Corpus
      - run: dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/out
      - run: LOFFICE_OUT=$RUNNER_TEMP/pptx go test ./pptx -run Corpus
      - run: dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/pptx
      - run: LOFFICE_EDITED=$RUNNER_TEMP/edited go test ./pptx -run Edits
      - run: LOFFICE_EDITED=1 dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/edited
      - run: LOFFICE_OUT=$RUNNER_TEMP/xlsx go test ./xlsx -run CorpusRewrite
      - run: dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/xlsx
      - run: LOFFICE_EDITED=$RUNNER_TEMP/xlsx-edited go test ./xlsx -run CorpusEdits
      - run: LOFFICE_EDITED=1 dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/xlsx-edited
      - run: LOFFICE_MOVED=$RUNNER_TEMP/xlsx-moved go test ./xlsx -run CorpusMoves
      - run: LOFFICE_EDITED=1 dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/xlsx-moved
      - run: LOFFICE_OUT=$RUNNER_TEMP/docx go test ./docx -run CorpusRewrite
      - run: dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/docx
      - run: LOFFICE_EDITED=$RUNNER_TEMP/docx-edited go test ./docx -run CorpusEdit
      - run: LOFFICE_EDITED=1 dotnet run --project tools/validate -c Release -- corpus/files $RUNNER_TEMP/docx-edited

  # The targets of the plan, measured: relaying a keystroke, calculating
  # 10 000 dependents again, opening a sheet of 100 000 × 20.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -bench Relay .
      - run: go test -run '^$' -bench 'Recalc|Follow|OpenLarge' -benchtime 5x ./formula ./xlsx

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
